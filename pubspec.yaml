name: cyclick
description: "Cyclick — Waze for Cyclists in Sector 2, Bucharest. A living map powered by citizen involvement."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Map (OpenStreetMap — no API key required)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location & GPS
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Navigation (declarative routing)
  go_router: ^13.2.0

  # UI & Fonts
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8

  # Backend — Supabase (Auth + PostgreSQL + PostGIS + Realtime)
  supabase_flutter: ^2.3.4

  # Localizations (Romanian / English)
  flutter_localizations:
    sdk: flutter

  # Networking (Weather — OpenMeteo, OSRM routing)
  http: ^1.2.1

  # Audio (music player)
  just_audio: ^0.9.36

  # Local push notifications (new routes, blocked routes)
  flutter_local_notifications: ^17.2.3

  # Utilities
  uuid: ^4.3.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true  # enables l10n code generation

  assets:
    - assets/images/
    - assets/icon/
    - arcgis/rute_buccccc.geojson
