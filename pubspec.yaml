name: cyclick
description: "Cyclick — Waze for Cyclists in Sector 2, Bucharest. A living map powered by citizen involvement."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Map (OpenStreetMap — no API key required)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location & GPS
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Navigation (declarative routing)
  go_router: ^13.2.0

  # UI & Fonts
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8

  # Backend — Supabase (Auth + PostgreSQL + PostGIS + Realtime)
  supabase_flutter: ^2.3.4

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
